# Builds the Android app from the game files in this repo.
# Run it by hand: Actions tab -> "Build Android app" -> Run workflow.
# It produces a test app (APK) you can download and install on your own phone.
name: Build Android app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Put the game files into the app
        run: |
          mkdir -p www
          for f in index.html sw.js manifest.webmanifest logo.jpg icon-192.png icon-512.png icon-maskable.png apple-touch-icon.png; do cp "$f" www/; done

      - name: Install Capacitor (the tool that wraps the game as an app)
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Create the Android project
        run: |
          cp android-capacitor.config.json capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Icons and screen orientation
        run: |
          mkdir -p android-config/assets
          cp android-icon-only.png android-config/assets/icon-only.png
          cp android-icon-foreground.png android-config/assets/icon-foreground.png
          cp android-icon-background.png android-config/assets/icon-background.png
          npx --yes @capacitor/assets@3 generate --android --assetPath android-config/assets
          sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml

      - name: Build the test app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save the test app so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: antropolis-test-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
