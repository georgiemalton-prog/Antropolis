# Runs on every push and pull request: checks the built files match src/, lints the code and runs the smoke test.
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Built files are up to date with src/
        run: python3 tools/build.py --check
      - name: Lint
        run: |
          npm install --no-save eslint@9
          python3 tools/lint.py
      - name: Smoke test (every screen, tunnel layout the same on every phone, no crossings)
        run: |
          pip install playwright
          # GitHub's servers sometimes can't download the test browser's fonts. Try a few times; if the browser
          # still can't be installed, skip the smoke test with a warning instead of failing the game's check
          ok=0
          for i in 1 2 3; do
            if python3 -m playwright install --with-deps chromium || python3 -m playwright install chromium; then ok=1; break; fi
            sleep 20
          done
          if [ "$ok" != 1 ]; then echo "::warning::Smoke test skipped: GitHub could not install the test browser (network problem, not the game)"; exit 0; fi
          python3 tools/test/smoke.py
